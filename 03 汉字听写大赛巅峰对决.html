<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>汉字听写大赛 · 巅峰对决专项</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:#0a0e27;color:#e0e0e0;min-height:100vh;overflow-x:hidden}
.header{text-align:center;padding:28px 20px 12px;background:linear-gradient(180deg,rgba(255,215,0,.15),transparent)}
.header h1{font-size:28px;color:#ffd700;text-shadow:0 0 20px rgba(255,215,0,.4);margin-bottom:4px}
.header p{color:#8892b0;font-size:14px}
.arena{max-width:860px;margin:0 auto;padding:0 20px 40px}

/* Scoreboard */
.scoreboard{display:flex;justify-content:center;gap:20px;margin:20px 0;flex-wrap:wrap}
.team-card{background:linear-gradient(135deg,#1a1f3a,#162040);border:2px solid #2a3050;border-radius:16px;padding:16px 24px;text-align:center;min-width:140px;transition:.3s}
.team-card.active{border-color:#ffd700;box-shadow:0 0 24px rgba(255,215,0,.2)}
.team-name{font-size:14px;color:#8892b0;margin-bottom:4px}
.team-score{font-size:32px;font-weight:800;color:#ffd700}
.team-streak{font-size:12px;color:#4ade80;min-height:18px}

/* Timer */
.timer-bar{height:6px;background:#1a1f3a;border-radius:3px;overflow:hidden;margin:12px 0}
.timer-fill{height:100%;background:linear-gradient(90deg,#4ade80,#facc15,#ef4444);transition:width .1s linear;border-radius:3px}
.timer-text{text-align:center;font-size:13px;color:#8892b0;margin-bottom:8px}
.timer-text span{font-size:24px;font-weight:700;color:#ffd700}

/* Question card */
.q-card{background:#151b33;border:2px solid #2a3050;border-radius:16px;padding:32px;margin:16px 0;text-align:center;min-height:300px;transition:.3s}
.q-card.correct{border-color:#22c55e;background:#0a1f15}
.q-card.wrong{border-color:#ef4444;background:#1f0a0a}
.q-type{font-size:13px;color:#ffd700;text-transform:uppercase;letter-spacing:2px;margin-bottom:8px}
.q-body{font-size:22px;font-weight:700;color:#f1f5f9;line-height:1.8;margin:16px 0;letter-spacing:1px}
.q-hint{font-size:14px;color:#64748b;margin:8px 0}
.q-answer{font-size:28px;font-weight:800;color:#ffd700;margin:12px 0;padding:12px;background:rgba(255,215,0,.1);border-radius:8px;display:none}
.q-note{font-size:14px;color:#94a3b8;margin-top:8px;display:none;line-height:1.8}

/* Options grid */
.opts-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:500px;margin:16px auto}
.opt-btn{padding:14px;background:#1e2545;border:2px solid #2a3050;border-radius:10px;color:#cbd5e1;font-size:15px;cursor:pointer;transition:.2s;text-align:center}
.opt-btn:hover{background:#2a3560;border-color:#4a60a0}
.opt-btn.chosen-right{background:#166534;border-color:#22c55e;color:#fff}
.opt-btn.chosen-wrong{background:#7f1d1d;border-color:#ef4444;color:#fff}
.opt-btn.reveal-right{background:rgba(34,197,94,.2);border-color:#22c55e}

/* Buttons */
.btn-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:12px 0}
.btn{padding:12px 24px;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;transition:.2s}
.btn-gold{background:linear-gradient(135deg,#ffd700,#f0a500);color:#0a0e27}
.btn-gold:hover{background:linear-gradient(135deg,#ffe44d,#f5b800)}
.btn-danger{background:#dc2626;color:#fff}
.btn-danger:hover{background:#b91c1c}
.btn-ghost{background:transparent;border:2px solid #4a60a0;color:#8892b0}
.btn-ghost:hover{background:#1e2545}

/* Stats row */
.stats-row{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin:12px 0}
.stat-chip{background:#1e2545;border-radius:8px;padding:8px 16px;text-align:center}
.stat-chip .val{font-size:20px;font-weight:700;color:#ffd700}
.stat-chip .lbl{font-size:11px;color:#64748b}

/* Mode selector */
.mode-bar{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:12px 0}
.mode-btn{padding:8px 18px;border-radius:20px;font-size:13px;cursor:pointer;background:#1e2545;color:#8892b0;border:1px solid #2a3050;transition:.2s}
.mode-btn:hover{background:#2a3560}
.mode-btn.active{background:#ffd700;color:#0a0e27;border-color:#ffd700;font-weight:700}

/* Review */
.review-list{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:12px 0}
.review-chip{padding:6px 14px;background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.3);border-radius:20px;font-size:13px;color:#fca5a5;cursor:pointer}
.review-chip:hover{background:rgba(239,68,68,.3)}

/* Countdown flash */
@keyframes flash{0%,100%{opacity:1}50%{opacity:.3}}
.flash{animation:flash .5s infinite}

.key-hint{text-align:center;font-size:12px;color:#4a5568;margin-top:24px}

@media(max-width:600px){
.header h1{font-size:20px}
.arena{padding:0 8px 24px}
.q-card{padding:20px 12px}
.q-body{font-size:17px}
.opts-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<!-- ===== PASSWORD GATE START ===== -->
<div id="pwdGate" style="position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#1a1a2e,#16213e,#0f3460);font-family:'Microsoft YaHei','PingFang SC',sans-serif;">
  <div style="background:rgba(255,255,255,0.08);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.15);border-radius:20px;padding:48px 56px;max-width:420px;width:90%;text-align:center;box-shadow:0 24px 64px rgba(0,0,0,0.4);">
    <div style="font-size:42px;margin-bottom:8px;">&#128274;</div>
    <h2 style="color:#fff;font-size:22px;font-weight:700;margin-bottom:6px;letter-spacing:1px;">03 汉字听写大赛巅峰对决</h2>
    <p style="color:rgba(255,255,255,0.5);font-size:13px;margin-bottom:28px;">请输入访问密码</p>
    <input id="pwdInput" type="password" placeholder="输入密码..." style="width:100%;padding:14px 18px;border-radius:10px;border:1px solid rgba(255,255,255,0.2);background:rgba(255,255,255,0.1);color:#fff;font-size:16px;outline:none;text-align:center;letter-spacing:2px;box-sizing:border-box;" autocomplete="off" />
    <p id="pwdError" style="color:#ef4444;font-size:13px;margin-top:10px;min-height:20px;opacity:0;transition:opacity .3s;">密码错误，请重新输入</p>
    <button id="pwdBtn" onclick="checkPwd()" style="width:100%;margin-top:8px;padding:14px;border-radius:10px;border:none;background:linear-gradient(135deg,#0f3460,#16537e);color:#fff;font-size:16px;font-weight:600;cursor:pointer;letter-spacing:2px;transition:.2s;">进入</button>
    <p style="color:rgba(255,255,255,0.25);font-size:11px;margin-top:20px;">&copy; 2026 包头市第四中学 张巍老师</p>
  </div>
</div>
<script>
(function(){
  var gate=document.getElementById('pwdGate');
  var input=document.getElementById('pwdInput');
  var btn=document.getElementById('pwdBtn');
  var err=document.getElementById('pwdError');
  var pwd="btszzw202603";
  var key='pwd_ok_'+location.pathname;
  if(sessionStorage.getItem(key)===pwd){gate.remove();return;}
  input.focus();
  input.addEventListener('keydown',function(e){if(e.key==='Enter')checkPwd();});
  function checkPwd(){
    var v=input.value.trim();
    if(v===pwd){
      sessionStorage.setItem(key,pwd);
      gate.style.transition='opacity .4s';
      gate.style.opacity='0';
      setTimeout(function(){gate.remove();},400);
    }else{
      err.style.opacity='1';
      input.value='';
      input.style.borderColor='#ef4444';
      setTimeout(function(){input.style.borderColor='rgba(255,255,255,0.2)';err.style.opacity='0';},2000);
      input.focus();
    }
  }
  window.checkPwd=checkPwd;
})();
</script>
<!-- ===== PASSWORD GATE END ===== -->

<div class="header">
<h1>⚡ 巅峰对决 · 抢答专项训练</h1>
<p>环节四：200分 · 限时抢答 — 模拟正式比赛节奏</p>
</div>

<div class="arena">
<!-- Mode selector -->
<div class="mode-bar">
<button class="mode-btn active" onclick="switchMode('all')">🔥 全部题型</button>
<button class="mode-btn" onclick="switchMode('choice')">📋 选择题</button>
<button class="mode-btn" onclick="switchMode('read')">🔊 读音题</button>
<button class="mode-btn" onclick="switchMode('image')">🖼 图文题</button>
<button class="mode-btn" onclick="switchMode('fill')">✏️ 填字组词</button>
<button class="mode-btn" onclick="switchMode('clue')">🔎 线索题</button>
<button class="mode-btn" onclick="switchMode('stroke')">🖊 笔顺题</button>
</div>

<!-- Stats -->
<div class="stats-row">
<div class="stat-chip"><div class="val" id="sTotal">0</div><div class="lbl">总题量</div></div>
<div class="stat-chip"><div class="val" id="sDone">0</div><div class="lbl">已完成</div></div>
<div class="stat-chip"><div class="val" id="sRight">0</div><div class="lbl">✅ 正确</div></div>
<div class="stat-chip"><div class="val" id="sWrong">0</div><div class="lbl">❌ 错误</div></div>
<div class="stat-chip"><div class="val" id="sStreak" style="color:#4ade80">0</div><div class="lbl">🔥 连击</div></div>
</div>

<!-- Timer -->
<div class="timer-bar"><div class="timer-fill" id="timerFill" style="width:100%"></div></div>
<div class="timer-text">⏱ <span id="timerNum">15</span> 秒</div>

<!-- Main card -->
<div class="q-card" id="qCard">
<div class="q-type" id="qType">选择题</div>
<div class="q-body" id="qBody"></div>
<div class="q-hint" id="qHint"></div>
<div class="opts-grid" id="optsGrid"></div>
<div class="q-answer" id="qAnswer"></div>
<div class="q-note" id="qNote"></div>
</div>

<!-- Action buttons -->
<div class="btn-row">
<button class="btn btn-gold" id="btnBuzz" onclick="buzzIn()">🔔 抢答!</button>
<button class="btn btn-ghost" id="btnShow" onclick="showAnswer()" style="display:none">👁 看答案</button>
<button class="btn btn-gold" id="btnRight" onclick="scoreRight()" style="display:none">✅ 答对了</button>
<button class="btn btn-danger" id="btnWrong" onclick="scoreWrong()" style="display:none">❌ 答错了</button>
<button class="btn btn-ghost" onclick="skipQuestion()">⏭ 跳过</button>
</div>

<!-- Wrong review -->
<div style="text-align:center;margin-top:16px">
<div style="color:#64748b;font-size:13px;margin-bottom:8px">📝 答错记录（点击复习）</div>
<div class="review-list" id="reviewList"><span style="color:#4a5568">暂无错题</span></div>
</div>

<div class="key-hint">⌨ 空格键=抢答 | Enter=看答案 | A=答对 | D=答错 | →=跳过</div>
</div>

<script>
// ========== 题库：巅峰对决全部题型 ==========
const allQuestions = [
  // ---- 选择题 (汉字知识) ----
  {type:"选择题",q:"「罄竹难书」中「罄」的意思是？",opts:["用尽","敲击","一种乐器","装满"],answer:0,note:"罄：尽、空。意为用尽竹子也写不完（罪行）。"},
  {type:"选择题",q:"下列哪个字在《通用规范汉字表》中属于二级字？",opts:["爨","的","一","人"],answer:0,note:"「爨」(cuàn) 是二级字，意为烧火做饭。"},
  {type:"选择题",q:"「不胫而走」中「胫」指的是？",opts:["小腿","脖子","手腕","脚踝"],answer:0,note:"胫：小腿。没有腿却能跑，形容消息传播迅速。"},
  {type:"选择题",q:"「买椟还珠」中的「椟」是指？",opts:["木匣","珍珠","盒子","柜子"],answer:0,note:"椟：木匣子。买下木匣退还珍珠，比喻没有眼光取舍不当。"},
  {type:"选择题",q:"「风声鹤唳」中「唳」的意思是？",opts:["鸟鸣","风声","尖叫","哭泣"],answer:0,note:"唳：鹤鸣叫。听到风声和鹤叫声都以为是追兵，形容惊慌失措。"},
  {type:"选择题",q:"「扪心自问」中「扪」的意思是？",opts:["按摸","敲打","打开","询问"],answer:0,note:"扪：按、摸。摸着胸口自己问自己，表示反省。"},
  {type:"选择题",q:"「筚路蓝缕」的「筚路」指什么？",opts:["柴车","竹路","破车","山路"],answer:0,note:"筚路：柴车；蓝缕：破衣服。驾柴车穿破衣开辟山林，形容创业艰辛。"},
  {type:"选择题",q:"下列哪个成语书写完全正确？",opts:["美轮美奂","美仑美奂","美伦美焕","美轮美焕"],answer:0,note:"「轮」指轮囷（高大的样子），「奂」指众多。形容房屋高大华丽。"},
  {type:"选择题",q:"「沆瀣一气」的「沆瀣」本义是？",opts:["夜间的水气","一种毒药","两个人名","河流名称"],answer:0,note:"沆瀣：夜间的水气。比喻臭味相投的人勾结在一起。"},
  {type:"选择题",q:"「动辄得咎」的「辄」意思是？",opts:["就","总是","往往","立刻"],answer:0,note:"辄：就。一动就受到责备，形容处境困难常受指责。"},
  {type:"选择题",q:"「焚膏继晷」中「晷」指什么？",opts:["日影","灯光","时间","蜡烛"],answer:0,note:"晷：日影，指白天。点灯接续日光，形容夜以继日地学习工作。"},
  {type:"选择题",q:"下列哪个词中「差」读 chā？",opts:["差强人意","参差不齐","差遣","差劲"],answer:0,note:"差(chā)强人意：大体上还能使人满意。参差(cēn cī)不齐。"},
  {type:"选择题",q:"「牝鸡司晨」的「牝」意思是？",opts:["雌性","公鸡","早晨","掌管"],answer:0,note:"牝：雌性的。母鸡报晓，旧时比喻妇女篡权乱政。"},
  {type:"选择题",q:"下列哪一组全部是形声字？",opts:["江河湖海","日月山水","上下左右","一二三四"],answer:0,note:"江(从水工声)、河(从水可声)、湖(从水胡声)、海(从水每声)都是形声字。"},
  {type:"选择题",q:"「暴殄天物」中「殄」的读音是？",opts:["tiǎn","zhēn","tiàn","diǎn"],answer:0,note:"暴殄(tiǎn)天物：任意糟蹋东西。殄：灭绝。"},
  {type:"选择题",q:"「开门揖盗」中「揖」的意思是？",opts:["拱手行礼","推开","迎接","揖让"],answer:0,note:"揖：拱手行礼。开门请强盗进来，比喻引进坏人自招祸患。"},
  {type:"选择题",q:"「万马齐喑」中「喑」的意思是？",opts:["哑","沉默","嘶鸣","暗"],answer:0,note:"喑：哑。万马都沉寂无声，比喻人们都沉默不说话。"},
  {type:"选择题",q:"下列哪个成语中没有错别字？",opts:["迫不及待","迫不急待","迫不即待","迫不及带"],answer:0,note:"「迫不及待」意为急迫得不能等待。「及」是赶上的意思。"},
  {type:"选择题",q:"「噤若寒蝉」的「噤」意思是？",opts:["闭口不作声","寒冷","颤抖","害怕"],answer:0,note:"噤：闭口不作声。像深秋的蝉一样不鸣叫，形容不敢作声。"},
  {type:"选择题",q:"下列哪个是「饮鸩止渴」中「鸩」的本义？",opts:["毒酒","毒鸟","一种病","苦酒"],answer:0,note:"鸩：传说中一种毒鸟，用其羽毛浸的酒可毒死人。比喻只顾眼前不顾后果。"},

  // ---- 读音题 ----
  {type:"读音题",q:"「心广体胖」中「胖」的正确读音是？",opts:["pán","pàng","bàn","pàn"],answer:0,note:"心广体胖(pán)：胸怀宽广身体安泰。胖(pán)：安泰舒适。"},
  {type:"读音题",q:"「大腹便便」中「便便」的读音是？",opts:["pián pián","biàn biàn","piān piān","biǎn biǎn"],answer:0,note:"便便(pián pián)：肥胖的样子。"},
  {type:"读音题",q:"「丢三落四」中「落」的正确读音是？",opts:["là","luò","lào","lā"],answer:0,note:"落(là)：遗漏、丢下。"},
  {type:"读音题",q:"「自怨自艾」中「艾」的正确读音是？",opts:["yì","ài","āi","yè"],answer:0,note:"自怨自艾(yì)：悔恨自己的错误并改正。艾(yì)：治理、改正。"},
  {type:"读音题",q:"「力能扛鼎」中「扛」的正确读音是？",opts:["gāng","káng","kàng","gàng"],answer:0,note:"扛(gāng)：双手举起。形容力大无比。"},
  {type:"读音题",q:"「呼天抢地」中「抢」的正确读音是？",opts:["qiāng","qiǎng","qiàng","chuǎng"],answer:0,note:"抢(qiāng)：碰、撞。形容极度悲痛。"},
  {type:"读音题",q:"「虚与委蛇」中「委蛇」的正确读音是？",opts:["wēi yí","wěi shé","wēi shé","wěi yí"],answer:0,note:"委蛇(wēi yí)：敷衍应付。"},
  {type:"读音题",q:"「拾级而上」中「拾」的正确读音是？",opts:["shè","shí","shì","shě"],answer:0,note:"拾(shè)级：逐级登阶。"},
  {type:"读音题",q:"「果实累累」中「累累」的正确读音是？",opts:["léi léi","lěi lěi","lèi lèi","léi lěi"],answer:0,note:"果实累累(léi léi)：形容果实成串、非常多。"},
  {type:"读音题",q:"「一曝十寒」中「曝」的正确读音是？",opts:["pù","bào","pū","bù"],answer:0,note:"曝(pù)：晒。晒一天冻十天，比喻做事没有恒心。"},

  // ---- 图文题 (文字描述图片场景) ----
  {type:"图文题",q:"【图】一个古代书生在油灯下读书，旁边堆满竹简，墙上映出巨大影子。请用一个成语描述此景。",opts:["焚膏继晷","凿壁偷光","悬梁刺股","囊萤映雪"],answer:0,note:"焚膏继晷：点油灯接续日光，形容夜以继日勤奋学习。图中油灯+竹简正是此意。"},
  {type:"图文题",q:"【图】一棵大树根深叶茂，树根盘根错节深入地下。请用一个成语形容。",opts:["根深蒂固","盘根错节","树大根深","枝繁叶茂"],answer:0,note:"根深蒂固：根基深厚牢固，不易动摇。"},
  {type:"图文题",q:"【图】一个人对着牛弹奏古琴，牛低头吃草毫无反应。这是什么成语？",opts:["对牛弹琴","班门弄斧","牛刀小试","泥牛入海"],answer:0,note:"对牛弹琴：比喻对不懂道理的人讲道理，白费口舌。"},
  {type:"图文题",q:"【图】画完一条蛇后又给它添上脚。这形容什么？",opts:["画蛇添足","画龙点睛","添枝加叶","节外生枝"],answer:0,note:"画蛇添足：比喻做了多余的事，非但无益反而有害。"},
  {type:"图文题",q:"【图】一个人捂着耳朵去偷铃铛。这是什么成语？",opts:["掩耳盗铃","自欺欺人","掩人耳目","盗铃掩耳"],answer:0,note:"掩耳盗铃：捂住耳朵偷铃铛，比喻自己欺骗自己。"},
  {type:"图文题",q:"【图】一只螳螂举起前臂试图挡住飞奔的马车。对应什么成语？",opts:["螳臂当车","蚍蜉撼树","以卵击石","不自量力"],answer:0,note:"螳臂当车：螳螂用前腿阻挡车子前进，比喻不自量力。"},
  {type:"图文题",q:"【图】船在江中行驶，有人在船舷上刻了一道记号。这叫什么？",opts:["刻舟求剑","刻不容缓","刻骨铭心","精雕细刻"],answer:0,note:"刻舟求剑：比喻拘泥成例，不知变通。"},
  {type:"图文题",q:"【图】一个人坐在井底仰头看天。请用一个成语形容他的见识。",opts:["坐井观天","管窥蠡测","一孔之见","井底之蛙"],answer:0,note:"坐井观天：坐在井底看天，比喻眼界狭窄见识短浅。"},
  {type:"图文题",q:"【图】一群盲人各自摸大象的不同部位，有人说像墙有人说像绳。",opts:["盲人摸象","盲人瞎马","问道于盲","有眼无珠"],answer:0,note:"盲人摸象：比喻以偏概全，不能了解事物的全部。"},
  {type:"图文题",q:"【图】农夫拔高禾苗帮它们生长，第二天禾苗全枯死了。",opts:["揠苗助长","拔苗助长","欲速不达","急功近利"],answer:0,note:"揠苗助长（本字为「揠」，后也作「拔苗助长」）：比喻违反规律急于求成。"},

  // ---- 填字组词题 ----
  {type:"填字组词",q:"请在括号中填一个字，使其与前后都能组成双音节词：出（）入化",answer:"神",opts:[""],note:"出神、神入化 → 出神入化"},
  {type:"填字组词",q:"请在括号中填一个字：马首是（）",answer:"瞻",opts:[""],note:"马首是瞻：原指作战时看主将马头方向行动，比喻服从指挥。"},
  {type:"填字组词",q:"请填写：含英（）华",answer:"咀",opts:[""],note:"含英咀华：嘴里含着花朵细细品味，比喻读书时细细体会精华。"},
  {type:"填字组词",q:"请填写：怙恶不（）",answer:"悛",opts:[""],note:"怙恶不悛(quān)：坚持作恶不肯悔改。悛：悔改。"},
  {type:"填字组词",q:"请填写：卖官（）爵",answer:"鬻",opts:[""],note:"卖官鬻(yù)爵：出卖官职爵位。鬻：卖。"},
  {type:"填字组词",q:"请填写：纵横（）阖",answer:"捭",opts:[""],note:"纵横捭(bǎi)阖：在政治外交上运用手段分化或拉拢。捭：开；阖：合。"},
  {type:"填字组词",q:"请在括号中填字：言简意（）",answer:"赅",opts:[""],note:"言简意赅(gāi)：言语简练意思完备。赅：完备。"},
  {type:"填字组词",q:"请填写：风声鹤（）",answer:"唳",opts:[""],note:"风声鹤唳(lì)：听到风声和鹤叫都以为是追兵，形容惊慌失措。"},
  {type:"填字组词",q:"请填写：（）杖明火",answer:"明",opts:[""],note:"明杖明火? 应该是「明火执仗」→ 明目张胆地为非作歹。"},
  {type:"填字组词",q:"请填写：不（）而走",answer:"胫",opts:[""],note:"不胫而走：没有腿却能跑，比喻消息传播迅速。胫：小腿。"},
  {type:"填字组词",q:"请填写：越俎代（）",answer:"庖",opts:[""],note:"越俎代庖：越过祭器去代替厨师做饭，比喻越权办事。"},
  {type:"填字组词",q:"请填写：不落（）臼",answer:"窠",opts:[""],note:"不落窠臼(kē jiù)：比喻文章或艺术有独创风格不落俗套。"},
  {type:"填字组词",q:"请在括号中填字：相形见（）",answer:"绌",opts:[""],note:"相形见绌(chù)：互相比较之下显出了不足。绌：不够、不足。"},
  {type:"填字组词",q:"请填写：鳞次（）比",answer:"栉",opts:[""],note:"鳞次栉(zhì)比：像鱼鳞和梳齿一样密密排列。栉：梳子。"},
  {type:"填字组词",q:"请填写：未雨绸（）",answer:"缪",opts:[""],note:"未雨绸缪(móu)：趁着天没下雨先修好门窗，比喻事先做好准备。"},

  // ---- 线索题 ----
  {type:"线索题",q:"【线索1】它是二级字表中的一个字\n【线索2】上中下结构，共30画\n【线索3】读 cuàn\n【线索4】本义是烧火做饭",answer:"爨",opts:[],note:"爨(cuàn)：生火做饭。是汉字中最复杂的常用字之一，共30画。"},
  {type:"线索题",q:"【线索1】左右结构，金字旁\n【线索2】12画\n【线索3】读 qiāng\n【线索4】意为古代的一种斧子",answer:"斨",opts:[],note:"注意：金字旁12画的常见字还有「锏」「锘」等。"},
  {type:"线索题",q:"【线索1】上下结构\n【线索2】21画\n【线索3】读 náng\n【线索4】意为口袋/包裹",answer:"囊",opts:[],note:"囊(náng)：探囊取物、囊中羞涩。"},
  {type:"线索题",q:"【线索1】半包围结构，鹿字底\n【线索2】19画\n【线索3】读 lù\n【线索4】山脚下",answer:"麓",opts:[],note:"山麓(lù)：山脚下。"},
  {type:"线索题",q:"【线索1】左右结构，酉字旁\n【线索2】14画\n【线索3】读 lèi\n【线索4】把酒洒在地上表示祭奠",answer:"酹",opts:[],note:"酹(lèi)：一樽还酹江月。"},
  {type:"线索题",q:"【线索1】上下结构，穴字头\n【线索2】14画\n【线索3】读 tiǎo\n【线索4】意为深远、幽深",answer:"窕",opts:[],note:"窈窕(yǎo tiǎo)：美好。"},
  {type:"线索题",q:"【线索1】左右结构，马字旁\n【线索2】12画\n【线索3】读 cān\n【线索4】古代三匹马拉的车",answer:"骖",opts:[],note:"骖(cān)乘：古代乘车陪乘的人。"},
  {type:"线索题",q:"【线索1】左右结构，鱼字旁\n【线索2】15画\n【线索3】读 zōu\n【线索4】意为小鱼、小人",answer:"鲰",opts:[],note:"鲰(zōu)生：浅薄无知的人。出自《史记》。"},
  {type:"线索题",q:"【线索1】上下结构，日在下\n【线索2】13画\n【线索3】读 guǐ\n【线索4】日影，引申为时光",answer:"晷",opts:[],note:"日晷(guǐ)：古代计时器。焚膏继晷。"},
  {type:"线索题",q:"【线索1】左右结构，米字旁\n【线索2】15画\n【线索3】读 qiǔ\n【线索4】干粮、炒面之类",answer:"糗",opts:[],note:"糗(qiǔ)：干粮。出糗→出丑。"},

  // ---- 笔顺题 ----
  {type:"笔顺题",q:"「万」字第二笔是什么？",answer:"横折钩",opts:[],note:"万的笔顺：横、横折钩、撇。第二笔是横折钩不是撇。"},
  {type:"笔顺题",q:"「及」字第一笔是什么？",answer:"撇",opts:[],note:"及的笔顺：撇、横折折撇、捺。"},
  {type:"笔顺题",q:"「乃」字第一笔是什么？",answer:"横折折折钩",opts:[],note:"乃的笔顺：横折折折钩、撇。"},
  {type:"笔顺题",q:"「母」字共几画？倒数第二笔是什么？",answer:"5画，横",opts:[],note:"母的笔顺：竖折、横折钩、点、横、点。共5画。"},
  {type:"笔顺题",q:"「车」作偏旁时的第三笔是什么？",answer:"横",opts:[],note:"车字旁笔顺：横、撇折、横、竖。"},
  {type:"笔顺题",q:"「火」字第一笔是什么？",answer:"点",opts:[],note:"火笔顺：点、撇、撇、捺。先两边后中间。"},
  {type:"笔顺题",q:"「必」字的正确笔顺第一笔是什么？",answer:"点",opts:[],note:"必笔顺：点、斜钩、点、撇、点。"},
  {type:"笔顺题",q:"「为」字第二笔是什么？",answer:"撇",opts:[],note:"为笔顺：点、撇、横折钩、点。"},
  {type:"笔顺题",q:"「方」字第三笔是什么？",answer:"横折钩",opts:[],note:"方笔顺：点、横、横折钩、撇。"},
  {type:"笔顺题",q:"「丑」字第一笔是什么？",answer:"横折",opts:[],note:"丑笔顺：横折、竖、横、横。"},,
  // ---- 选择题 (扩展 30题) ----
  {type:"选择题",q:"「繁文缛节」中「缛」的意思是？",opts:["繁琐","丝织品","侮辱","软弱"],answer:0,note:"缛(rù)：繁琐。繁文缛节指繁琐的仪式和礼节。"},
  {type:"选择题",q:"「高屋建瓴」中「瓴」是指？",opts:["盛水的瓶子","房顶","瓦片","屋檐"],answer:0,note:"建：倾倒；瓴：盛水的瓶子。从高屋上倒水，比喻居高临下势不可挡。"},
  {type:"选择题",q:"「铩羽而归」的「铩」本义是？",opts:["摧残","杀死","长矛","箭"],answer:0,note:"铩(shā)羽：伤了翅膀。比喻失败或不得志而归。"},
  {type:"选择题",q:"下列哪个字是象形字？",opts:["日","休","刃","本"],answer:0,note:"「日」是象形字，画一个圆中间一点。「刃」是指事字，「休」「本」是会意字。"},
  {type:"选择题",q:"下列哪个成语书写完全正确？",opts:["不胫而走","不径而走","不竟而走","不颈而走"],answer:0,note:"不胫而走：没有腿却能跑。胫：小腿。不是「径」。"},
  {type:"选择题",q:"「色厉内荏」中「荏」的意思是？",opts:["软弱","坚强","红色","忍耐"],answer:0,note:"色厉内荏(rěn)：外表强硬内心怯懦。荏：软弱。"},
  {type:"选择题",q:"「方兴未艾」的「艾」意思是？",opts:["停止","艾草","兴盛","燃烧"],answer:0,note:"方兴未艾(ài)：正在发展尚未停止。艾：停止。"},
  {type:"选择题",q:"「稗官野史」中「稗」指？",opts:["微小卑贱","稻田","史官","野草"],answer:0,note:"稗(bài)官：小官。野史：民间记载。比喻微贱的记载。"},
  {type:"选择题",q:"「否极泰来」中「否」的读音和意思是？",opts:["pǐ，坏的","fǒu，否定","fū，否则","pī，坏"],answer:0,note:"否(pǐ)极泰来：坏的到了尽头好的就来了。"},
  {type:"选择题",q:"下列哪个字属于六书中的「指事」字？",opts:["上","江","武","闻"],answer:0,note:"「上」是指事字，在横线上加一短横表方位。「江」形声，「武」会意，「闻」形声。"},
  {type:"选择题",q:"「擢发难数」中「擢」的意思是？",opts:["拔","挑选","提拔","梳理"],answer:0,note:"擢(zhuó)发难数：拔下头发来数也数不清，形容罪行极多。"},
  {type:"选择题",q:"下列哪个成语没有错别字？",opts:["流言蜚语","流言非语","流言飞语","留言蜚语"],answer:0,note:"流言蜚语：毫无根据的话。蜚：同「飞」，指散布。"},
  {type:"选择题",q:"「箪食壶浆」中「箪」指什么？",opts:["盛饭的竹器","水壶","篮子","碗"],answer:0,note:"箪(dān)：古代盛饭的圆形竹器。形容军队受百姓欢迎。"},
  {type:"选择题",q:"「以儆效尤」中「儆」的意思是？",opts:["警告","惩罚","效仿","害怕"],answer:0,note:"儆(jǐng)：警告。效尤：仿效坏的行为。"},
  {type:"选择题",q:"「既往不咎」的「咎」意思是？",opts:["责备","过错","追究","惩罚"],answer:0,note:"既往不咎(jiù)：对过去的错误不再责备追究。"},
  {type:"选择题",q:"下列哪个字是二年级字表中的二级字？",opts:["爨","人","口","手"],answer:0,note:"爨(cuàn)是二级字表中最复杂的字之一。"},
  {type:"选择题",q:"「老牛舐犊」中「舐」的意思是？",opts:["舔","喂养","保护","呼唤"],answer:0,note:"舐(shì)犊：老牛舔小牛，比喻父母疼爱子女。"},
  {type:"选择题",q:"「风驰电掣」中「掣」的意思是？",opts:["闪过","拉住","雷电","飞驰"],answer:0,note:"掣(chè)：闪过。形容像刮风和闪电那样迅速。"},
  {type:"选择题",q:"以下哪个成语书写完全正确？",opts:["悬梁刺股","悬梁刺骨","悬粱刺股","玄梁刺骨"],answer:0,note:"悬梁刺股：头悬梁锥刺股。股：大腿，不是「骨」。"},
  {type:"选择题",q:"「户枢不蠹」中「蠹」的意思是？",opts:["蛀蚀","虫子","腐烂","损坏"],answer:0,note:"蠹(dù)：蛀蚀。门轴常转动不会被虫蛀，比喻运动的东西不易受侵蚀。"},
  {type:"选择题",q:"「病入膏肓」的「肓」指哪个部位？",opts:["心脏与膈膜之间","眼睛","大脑","骨骼"],answer:0,note:"膏肓(huāng)：心尖脂肪与心脏之间的部位，古代认为是药力达不到的地方。"},
  {type:"选择题",q:"「目不暇接」中「暇」的意思是？",opts:["空闲","眼睛","时间","接续"],answer:0,note:"目不暇接：眼睛来不及看，形容东西太多看不过来。暇：空闲。"},
  {type:"选择题",q:"下列哪个词中的字全是形声字？",opts:["聋盲闻聪","上下本末","日月水火","一二三四"],answer:0,note:"聋(从耳龙声)、盲(从目亡声)、闻(从耳门声)、聪(从耳总声)都是形声字。"},
  {type:"选择题",q:"下列哪个成语中没有错别字？",opts:["按部就班","按步就班","安步就班","按部就搬"],answer:0,note:"按部就班：按照一定的步骤顺序进行。部：门类；班：次序。"},
  {type:"选择题",q:"「陟罚臧否」中「陟」的意思是？",opts:["提升","贬斥","奖励","惩罚"],answer:0,note:"陟(zhì)罚臧否：提升、惩罚、表扬、批评，泛指对下级的考核。"},
  {type:"选择题",q:"「饿殍遍野」中「殍」指什么？",opts:["饿死的人","尸体","灾民","难民"],answer:0,note:"殍(piǎo)：饿死的人。形容灾荒严重饿死的人到处都是。"},
  {type:"选择题",q:"「身陷囹圄」中「囹圄」指什么？",opts:["监狱","困境","沼泽","陷阱"],answer:0,note:"囹圄(líng yǔ)：监狱。"},
  {type:"选择题",q:"下列哪个成语书写完全正确？",opts:["计日程功","计日成功","即日程功","即日成功"],answer:0,note:"计日程功：可以数着日子计算功效，形容进展快有把握成功。"},
  {type:"选择题",q:"「栉风沐雨」中「栉」的意思是？",opts:["梳子","帽子","雨具","头发"],answer:0,note:"栉(zhì)风沐雨：风梳头雨洗发，形容奔波劳碌不避风雨。"},
  {type:"选择题",q:"「间不容发」中「间」的意思是？",opts:["空隙","时间","房间","中间"],answer:0,note:"间(jiān)不容发：空隙中没有一根头发的空间，形容情势极其危急。"},

  // ---- 读音题 (扩展 30题) ----
  {type:"读音题",q:"「按捺不住」中「捺」的正确读音是？",opts:["nà","nài","nǎn","nèi"],answer:0,note:"捺(nà)：按、抑制。"},
  {type:"读音题",q:"「身陷囹圄」中「圄」的正确读音是？",opts:["yǔ","wú","yù","yǔ"],answer:0,note:"囹圄(líng yǔ)：监狱。"},
  {type:"读音题",q:"「既往不咎」中「咎」的正确读音是？",opts:["jiù","jiū","jiǔ","chù"],answer:0,note:"咎(jiù)：责备。"},
  {type:"读音题",q:"「纵横捭阖」中「捭」的正确读音是？",opts:["bǎi","bēi","bǐ","bǎi"],answer:0,note:"捭(bǎi)阖(hé)：开合。"},
  {type:"读音题",q:"「否极泰来」中「否」的正确读音是？",opts:["pǐ","fǒu","fū","fù"],answer:0,note:"否(pǐ)：坏、恶运。"},
  {type:"读音题",q:"「色厉内荏」中「荏」的正确读音是？",opts:["rěn","rèn","rén","rǔn"],answer:0,note:"荏(rěn)：软弱。"},
  {type:"读音题",q:"「以儆效尤」中「儆」的正确读音是？",opts:["jǐng","jìng","jīng","qíng"],answer:0,note:"儆(jǐng)：警告。"},
  {type:"读音题",q:"「窗明几净」中「几」的正确读音是？",opts:["jī","jǐ","jì","jí"],answer:0,note:"几(jī)净：茶几干净。"},
  {type:"读音题",q:"「呱呱坠地」中「呱」的正确读音是？",opts:["gū","guā","guǎ","gǔ"],answer:0,note:"呱(gū)呱：婴儿哭声。"},
  {type:"读音题",q:"「踽踽独行」中「踽」的正确读音是？",opts:["jǔ","yǔ","jú","yú"],answer:0,note:"踽(jǔ)踽：孤零零的样子。"},
  {type:"读音题",q:"「稗官野史」中「稗」的正确读音是？",opts:["bài","bēi","bǐ","pí"],answer:0,note:"稗(bài)：微小卑贱。"},

  {type:"读音题",q:"「呶呶不休」中「呶」的正确读音是？",opts:["náo","nú","nǎo","nǔ"],answer:0,note:"呶(náo)呶：唠唠叨叨。"},
  {type:"读音题",q:"「未雨绸缪」中「缪」的正确读音是？",opts:["móu","miù","miào","mù"],answer:0,note:"绸缪(móu)：紧密缠缚，引申为修补。"},

  // ---- 图文题 (扩展 15题) ----
  {type:"图文题",q:"【图】一个人在磨一根铁棒，旁边有人问他在干什么。请用一个成语描述。",opts:["磨杵成针","铁杵磨针","磨刀霍霍","功夫不负"],answer:0,note:"磨杵成针：只要功夫深铁杵磨成针。比喻做任何事只要持之以恒就能成功。"},
  {type:"图文题",q:"【图】口衔石子投向大海的小鸟。这个神话故事的名字是什么？",opts:["精卫填海","愚公移山","女娲补天","夸父追日"],answer:0,note:"精卫填海：炎帝之女精卫溺死于东海，化为小鸟不断衔石填海。"},
  {type:"图文题",q:"【图】一个人站在河边感叹时光如流水般逝去。这是什么成语？",opts:["逝者如斯","光阴似箭","日月如梭","白驹过隙"],answer:0,note:"逝者如斯：时光像河水一样流去。出自《论语》。"},
  {type:"图文题",q:"【图】厨房里厨师用的砧板上放着一条鱼。请用一个成语描述下面的场景：有人越过砧板去炒菜。",opts:["越俎代庖","越权办事","多管闲事","喧宾夺主"],answer:0,note:"越俎(zǔ)代庖：越过祭器去代替厨师做饭，比喻越权办事。"},
  {type:"图文题",q:"【图】一只乌鸦飞回来给老乌鸦喂食。这是什么成语？",opts:["乌鸟私情","乌鸦反哺","羊羔跪乳","慈乌反哺"],answer:0,note:"乌鸟私情：乌鸦反哺比喻子女孝养父母。"},
  {type:"图文题",q:"【图】两人在桃园中结拜为兄弟。这代表什么成语？",opts:["桃园结义","金兰之交","八拜之交","义结金兰"],answer:0,note:"桃园结义：刘关张桃园三结义，比喻异姓结为兄弟。"},
  {type:"图文题",q:"【图】一个人拿着竹管看天空，另一个人用贝壳量海水。这叫什么？",opts:["管窥蠡测","坐井观天","以管窥豹","一孔之见"],answer:0,note:"管窥蠡(lí)测：从竹管里看天用贝壳量海水，比喻见识狭窄片面。"},
  {type:"图文题",q:"【图】蚕吐出丝把自己包在里面，最后变成了茧。比喻什么？",opts:["作茧自缚","春蚕到死","蚕食鲸吞","吐丝自缚"],answer:0,note:"作茧自缚：蚕吐丝作茧把自己包在里面，比喻自己束缚自己。"},
  {type:"图文题",q:"【图】一个和尚在撞钟，声音响彻云霄。这是什么成语？",opts:["响遏行云","声振寰宇","震耳欲聋","穿云裂石"],answer:0,note:"响遏(è)行云：声音高入云霄把流动的云都阻止了。"},
  {type:"图文题",q:"【图】一个人背着荆条（带刺的树枝）去向另一个人请罪。这是什么典故？",opts:["负荆请罪","廉颇蔺相如","将相和","负薪救火"],answer:0,note:"负荆请罪：背着荆条请罪，出自廉颇蔺相如的故事，比喻主动认错赔罪。"},
  {type:"图文题",q:"【图】两人在弹琴，旁边一人听得入神。表示知音难觅的成语是？",opts:["高山流水","知音难觅","琴瑟和鸣","对牛弹琴"],answer:0,note:"高山流水：伯牙鼓琴钟子期听之，比喻知音或乐曲高妙。"},
  {type:"图文题",q:"【图】和氏璧完整无缺地从一个国家回到了另一个国家。",opts:["完璧归赵","物归原主","和璧归赵","璧还"],answer:0,note:"完璧归赵：蔺相如把和氏璧完好地带回赵国，比喻原物完整归还。"},
  {type:"图文题",q:"【图】一个书生头悬梁（把头发系在房梁上）防止打瞌睡，另一个人用锥子刺大腿。",opts:["悬梁刺股","发愤图强","勤学苦练","废寝忘食"],answer:0,note:"悬梁刺股：头悬梁锥刺股，形容刻苦学习到极致。"},
  {type:"图文题",q:"【图】一群人在围着棋局争论，旁边两个小孩在观棋。这跟哪个成语有关？",opts:["观棋烂柯","专心致志","棋逢对手","局外之人"],answer:0,note:"观棋烂柯(kē)：传说有人看仙人下棋，等棋下完发现斧柄已腐烂，百年已过。"},
  {type:"图文题",q:"【图】一个渔夫在河边钓鱼，旁边山上有人在砍柴。表示隐居生活的意境？",opts:["渔樵耕读","世外桃源","归隐山林","闲云野鹤"],answer:0,note:"渔樵耕读：渔夫、樵夫、农夫、书生，古代四种基本生活方式。"},

  {type:"线索题",q:"【线索1】左右结构，口字旁\n【线索2】右边「鸟」\n【线索3】读míng\n【线索4】意为发出声音",answer:"鸣",opts:[],note:"鸣(míng)。"},
  {type:"线索题",q:"【线索1】左右结构，言字旁\n【线索2】右边「荒」\n【线索3】读huǎng\n【线索4】意为假话、欺骗",answer:"谎",opts:[],note:"谎言(huǎng yán)。"},

  {type:"笔顺题",q:"「嘉」字共几画？左边是什么偏旁？",answer:"14画，左边是「壴」",opts:[],note:"嘉：上部是「壴」(zhù)不是「鼓」。"},
  {type:"笔顺题",q:"「戴」字共几画？",answer:"17画",opts:[],note:"戴：17画，注意结构分解。"},
  {type:"笔顺题",q:"「承」字是先写两边还是先写中间？",answer:"先写中间",opts:[],note:"承笔顺：横撇、竖钩、横、横、横撇、撇、捺。"},
  {type:"笔顺题",q:"「延」字第二笔是什么？",answer:"竖",opts:[],note:"延笔顺：撇、竖、横、竖折、横折折、点。"},

];

let currentMode = 'all';
let questions = [...allQuestions];
let qIndex = 0;
let rightCount = 0, wrongCount = 0, streak = 0;
let answered = false;
let wrongList = [];
let timerInterval = null;
let timeLeft = 15;
let timerRunning = false;

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a}

function switchMode(mode){
  currentMode = mode;
  document.querySelectorAll('.mode-btn').forEach(b=>b.classList.remove('active'));
  event.target.classList.add('active');
  if(mode==='all') questions = [...allQuestions];
  else questions = allQuestions.filter(q=>{
    const m={'choice':'选择题','read':'读音题','image':'图文题','fill':'填字组词','clue':'线索题','stroke':'笔顺题'};
    return q.type===m[mode];
  });
  shuffle(questions);
  qIndex=0; resetState();
  document.getElementById('sTotal').textContent=questions.length;
  loadQuestion();
}

function resetState(){answered=false;rightCount=0;wrongCount=0;streak=0;wrongList=[];stopTimer();updateStats();renderWrongList()}

function loadQuestion(){
  if(questions.length===0){document.getElementById('qBody').textContent='该题型暂无题目';return}
  if(qIndex>=questions.length) qIndex=0;
  answered=false;stopTimer();timeLeft=15;
  document.getElementById('qCard').className='q-card';
  document.getElementById('btnBuzz').style.display='inline-block';
  document.getElementById('btnShow').style.display='none';
  document.getElementById('btnRight').style.display='none';
  document.getElementById('btnWrong').style.display='none';
  const q=questions[qIndex];
  document.getElementById('qType').textContent='⚡ '+q.type;
  document.getElementById('qBody').textContent=q.q;
  document.getElementById('qHint').textContent='';
  document.getElementById('qAnswer').style.display='none';
  document.getElementById('qNote').style.display='none';
  document.getElementById('timerNum').textContent='15';
  document.getElementById('timerFill').style.width='100%';
  document.getElementById('timerNum').classList.remove('flash');
  renderOpts(q);
}

function renderOpts(q){
  const grid=document.getElementById('optsGrid');
  if(!q.opts||q.opts.length===0){grid.innerHTML='';return}
  const labels=['A','B','C','D'];
  grid.innerHTML=q.opts.map((o,i)=>`<button class="opt-btn" data-idx="${i}" onclick="chooseOpt(${i})">${labels[i]}. ${o}</button>`).join('');
}

function buzzIn(){
  if(answered)return;
  answered=true;
  document.getElementById('btnBuzz').style.display='none';
  document.getElementById('btnShow').style.display='inline-block';
  document.getElementById('btnRight').style.display='inline-block';
  document.getElementById('btnWrong').style.display='inline-block';
  startTimer();
}

function startTimer(){
  if(timerRunning)return;
  timerRunning=true;timeLeft=15;
  timerInterval=setInterval(()=>{
    timeLeft--;
    document.getElementById('timerNum').textContent=timeLeft;
    document.getElementById('timerFill').style.width=(timeLeft/15*100)+'%';
    if(timeLeft<=5)document.getElementById('timerNum').classList.add('flash');
    if(timeLeft<=0){stopTimer();timeout()}
  },1000);
}

function stopTimer(){timerRunning=false;clearInterval(timerInterval);timerInterval=null;document.getElementById('timerNum').classList.remove('flash')}

function timeout(){
  document.getElementById('qCard').className='q-card wrong';
  document.getElementById('qHint').textContent='⏰ 时间到！';
  document.getElementById('btnShow').style.display='none';
  document.getElementById('btnRight').style.display='none';
  document.getElementById('btnWrong').style.display='none';
  showAnswer();
  wrongCount++;streak=0;
  addWrong();
  updateStats();
}

function chooseOpt(idx){
  if(!answered||document.getElementById('qAnswer').style.display!=='none')return;
  stopTimer();
  const q=questions[qIndex];
  const correct=q.answer===idx;
  const btns=document.querySelectorAll('.opt-btn');
  btns.forEach(b=>{b.disabled=true;if(parseInt(b.dataset.idx)===q.answer)b.classList.add('reveal-right')});
  if(correct){btns[idx].classList.add('chosen-right')}else{btns[idx].classList.add('chosen-wrong')}
  document.getElementById('qCard').className='q-card '+(correct?'correct':'wrong');
  document.getElementById('btnShow').style.display='none';
  document.getElementById('btnRight').style.display='none';
  document.getElementById('btnWrong').style.display='none';
  showAnswer();
  if(correct){rightCount++;streak++}else{wrongCount++;streak=0}
  addWrong();
  updateStats();
}

function showAnswer(){
  const q=questions[qIndex];
  document.getElementById('qAnswer').style.display='block';
  document.getElementById('qAnswer').textContent='✅ 答案：'+q.answer;
  document.getElementById('qNote').style.display='block';
  document.getElementById('qNote').textContent=q.note||'';
}

function scoreRight(){
  if(!answered||document.getElementById('qAnswer').style.display!=='none')return;
  stopTimer();
  document.getElementById('qCard').className='q-card correct';
  document.getElementById('btnShow').style.display='none';
  document.getElementById('btnRight').style.display='none';
  document.getElementById('btnWrong').style.display='none';
  showAnswer();
  rightCount++;streak++;
  updateStats();
}

function scoreWrong(){
  if(!answered||document.getElementById('qAnswer').style.display!=='none')return;
  stopTimer();
  document.getElementById('qCard').className='q-card wrong';
  document.getElementById('btnShow').style.display='none';
  document.getElementById('btnRight').style.display='none';
  document.getElementById('btnWrong').style.display='none';
  showAnswer();
  wrongCount++;streak=0;
  addWrong();
  updateStats();
}

function addWrong(){
  const w=questions[qIndex];
  if(!wrongList.find(x=>x.q===w.q))wrongList.push(w);
  renderWrongList();
}

function skipQuestion(){
  stopTimer();
  answered=false;
  qIndex++;if(qIndex>=questions.length)qIndex=0;
  loadQuestion();
}

function updateStats(){
  document.getElementById('sTotal').textContent=questions.length;
  document.getElementById('sDone').textContent=rightCount+wrongCount;
  document.getElementById('sRight').textContent=rightCount;
  document.getElementById('sWrong').textContent=wrongCount;
  document.getElementById('sStreak').textContent=streak;
}

function renderWrongList(){
  const el=document.getElementById('reviewList');
  if(wrongList.length===0){el.innerHTML='<span style="color:#4a5568">暂无错题</span>';return}
  el.innerHTML=wrongList.map((w,i)=>`<span class="review-chip" onclick="reviewWrong(${i})">${w.type}: ${w.answer}</span>`).join('');
}

function reviewWrong(i){
  const w=wrongList[i];
  const idx=questions.findIndex(q=>q.q===w.q);
  if(idx>=0){qIndex=idx;loadQuestion()}
}

// Keyboard
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;
  switch(e.code){
    case 'Space':e.preventDefault();if(!answered)buzzIn();break;
    case 'Enter':e.preventDefault();if(answered)showAnswer();break;
    case 'KeyA':e.preventDefault();if(answered)scoreRight();break;
    case 'KeyD':e.preventDefault();if(answered)scoreWrong();break;
    case 'ArrowRight':e.preventDefault();skipQuestion();break;
  }
});

// Init
shuffle(questions);
document.getElementById('sTotal').textContent=allQuestions.length;
loadQuestion();
</script>
