.hidden{display:none}
.btn-row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:20px 0}
.btn{padding:12px 28px;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;transition:.2s}
.btn-primary{background:#0f3460;color:#fff}

.btn-success{background:#27ae60;color:#fff}

.btn-outline{background:transparent;border:2px solid #0f3460;color:#0f3460}

</head>

<div id="pwdGate" style="position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#1a1a2e,#16213e,#0f3460);font-family:'Microsoft YaHei','PingFang SC',sans-serif;">

    <h2 style="color:#fff;font-size:22px;font-weight:700;margin-bottom:6px;letter-spacing:1px;">02 汉字听写大赛进阶训练</h2>
    <p style="color:rgba(255,255,255,0.5);font-size:13px;margin-bottom:28px;">请输入访问密码</p>
    <input id="pwdInput" type="password" placeholder="输入密码..." style="width:100%;padding:14px 18px;border-radius:10px;border:1px solid rgba(255,255,255,0.2);background:rgba(255,255,255,0.1);color:#fff;font-size:16px;outline:none;text-align:center;letter-spacing:2px;box-sizing:border-box;" autocomplete="off" />
    <p id="pwdError" style="color:#ef4444;font-size:13px;margin-top:10px;min-height:20px;opacity:0;transition:opacity .3s;">密码错误，请重新输入</p>
    <button id="pwdBtn" onclick="checkPwd()" style="width:100%;margin-top:8px;padding:14px;border-radius:10px;border:none;background:linear-gradient(135deg,#0f3460,#16537e);color:#fff;font-size:16px;font-weight:600;cursor:pointer;letter-spacing:2px;transition:.2s;">进入</button>
    <p style="color:rgba(255,255,255,0.25);font-size:11px;margin-top:20px;">&copy; 2026 包头市第四中学 张巍老师</p>
  </div>
</div>
<script>
(function(){
  var gate=document.getElementById('pwdGate');
  var input=document.getElementById('pwdInput');
  var btn=document.getElementById('pwdBtn');
  var err=document.getElementById('pwdError');
  var pwd="btszzw202602";
  var key='pwd_ok_'+location.pathname;
  if(sessionStorage.getItem(key)===pwd){gate.remove();return;}
  input.focus();
  input.addEventListener('keydown',function(e){if(e.key==='Enter')checkPwd();});
  function checkPwd(){
    var v=input.value.trim();
    if(v===pwd){
      sessionStorage.setItem(key,pwd);
      gate.style.transition='opacity .4s';
      gate.style.opacity='0';
      setTimeout(function(){gate.remove();},400);
    }else{
      err.style.opacity='1';
      input.value='';
      input.style.borderColor='#ef4444';
      setTimeout(function(){input.style.borderColor='rgba(255,255,255,0.2)';err.style.opacity='0';},2000);
      input.focus();
    }
  }
  window.checkPwd=checkPwd;
})();
</script>
<!-- ===== PASSWORD GATE END ===== -->

// ========== 应用状态 ==========
let currentBank = 'dianzichengshi';
let currentIndex = 0;
let answered = false;
let totalDone = 0, totalRight = 0, totalWrong = 0;
let mistakes = {}; // {bankKey: [indices]}
let mistakeReviewMode = false;
let reviewQueue = [];
let reviewIdx = 0;

// 用户交互（选字成语）
let selectedPoolIndices = [];
let xuanziCurrent = null;

// ========== 渲染 ==========
function init() {
  renderTabs();
  loadQuestions();
  updateStats();
}

function renderTabs() {
  const bar = document.getElementById('tabBar');
  bar.innerHTML = '';
  for (const [key, bank] of Object.entries(questionBanks)) {
    const tab = document.createElement('div');
    tab.className = 'tab' + (key === currentBank ? ' active' : '');
    tab.textContent = bank.label;
    tab.onclick = () => switchBank(key);
    bar.appendChild(tab);
  }
}

function switchBank(key) {
  if (mistakeReviewMode) {
    mistakeReviewMode = false;
  }
  currentBank = key;
  currentIndex = 0;
  answered = false;
  selectedPoolIndices = [];
  document.getElementById('mistakeList').innerHTML = '<span style="color:#aaa;font-size:14px">暂无错题，加油！</span>';
  document.getElementById('mistakeBtnRow').style.display = 'none';
  renderTabs();
  loadQuestions();
}

function loadQuestions() {
  const bank = questionBanks[currentBank];
  document.getElementById('totalQ').textContent = bank.questions.length;
  updateStats();
  showQuestion();
}

function getQuestion() {
  if (mistakeReviewMode && reviewQueue.length > 0) {
    if (reviewIdx >= reviewQueue.length) reviewIdx = 0;
    const item = reviewQueue[reviewIdx];
    return { bankKey: item.bankKey, q: questionBanks[item.bankKey].questions[item.idx], idx: item.idx };
  }
  const bank = questionBanks[currentBank];
  const q = bank.questions[currentIndex];
  return { bankKey: currentBank, q, idx: currentIndex };
}

function showQuestion() {
  const { bankKey, q } = getQuestion();
  answered = false;
  selectedPoolIndices = [];
  xuanziCurrent = null;

  // Buttons
  document.getElementById('btnReveal').classList.remove('hidden');
  document.getElementById('btnRight').classList.add('hidden');
  document.getElementById('btnWrong').classList.add('hidden');

  const area = document.getElementById('questionArea');
  let html = '';

  switch(bankKey) {
    case 'dianzichengshi':
      html = renderDianzichengshi(q);
      break;
    case 'chengyuhuanyuan':
      html = renderChengyuHuanyuan(q);
      break;
    case 'xuanziChengyu':
      html = renderXuanziChengyu(q);
      xuanziCurrent = q;
      break;
    case 'duyinXuanze':
      html = renderDuyin(q);
      break;
    case 'bishunShuxie':
      html = renderBishun(q);
      break;
    case 'xiansuoCaizi':
      html = renderXiansuo(q);
      break;
  }

  area.innerHTML = html;

  // Progress
  const total = mistakeReviewMode ? reviewQueue.length : questionBanks[currentBank].questions.length;
  const done = mistakeReviewMode ? reviewIdx : currentIndex;
  document.getElementById('progText').textContent = (done + 1) + ' / ' + total;
  document.getElementById('progFill').style.width = ((done + 1) / total * 100) + '%';

  // Attach click handlers for pool chars (选字成语)
  if (bankKey === 'xuanziChengyu') {
    setTimeout(() => {
      document.querySelectorAll('.pool-char').forEach(el => {
        el.onclick = () => togglePoolChar(el, parseInt(el.dataset.idx));
      });
    }, 10);
  }
}

function renderDianzichengshi(q) {
  let chars = [...new Set(q.chars.split(''))]; //unique chars
  // shuffle
  for (let i = chars.length - 1; i > 0; i--) { const j = Math.floor(Math.random()*(i+1)); [chars[i],chars[j]]=[chars[j],chars[i]]; }
  const charHtml = chars.map(c => `<span class="pool-char" style="cursor:default;width:52px;height:52px;font-size:22px">${c}</span>`).join('');
  return `
    <div class="q-prompt">📜 点字成诗 · ${q.hint}</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:16px 0;max-width:600px;margin-left:auto;margin-right:auto">
      ${charHtml}
    </div>
    <div class="q-sub">请从以上字中选出正确顺序，拼出下句（共${q.answer.length}字）</div>
    <div id="answerZone" class="answer-zone hidden">
      <div class="answer-reveal">${q.answer}</div>
      <div class="answer-extra">全句：${q.extra}</div>
    </div>
  `;
}

function renderChengyuHuanyuan(q) {
  let chars = q.scrambled.split('');
  for (let i = chars.length - 1; i > 0; i--) { const j = Math.floor(Math.random()*(i+1)); [chars[i],chars[j]]=[chars[j],chars[i]]; }
  return `
    <div class="q-prompt">🔀 成语还原</div>
    <div class="q-content" style="letter-spacing:12px">${chars.join(' ')}</div>
    <div class="q-sub">请将以上打乱的成语还原为正确写法</div>
    <div id="answerZone" class="answer-zone hidden">
      <div class="answer-reveal">${q.answer}</div>
      <div class="answer-extra">${q.explain}</div>
    </div>
  `;
}

function renderXuanziChengyu(q) {
  let poolChars = [...new Set(q.pool.split(''))];
  for (let i = poolChars.length - 1; i > 0; i--) { const j = Math.floor(Math.random()*(i+1)); [poolChars[i],poolChars[j]]=[poolChars[j],poolChars[i]]; }
  const grid = poolChars.map((c,i) => `<span class="pool-char" data-idx="${i}">${c}</span>`).join('');
  return `
    <div class="q-prompt">🔤 选字成「语」</div>
    <div class="q-sub">提示：${q.desc}</div>
    <div class="pool-grid" style="justify-content:center;max-width:500px;margin:16px auto">${grid}</div>
    <div class="q-sub">已选字（${q.answer.length}字成语）：</div>
    <div class="selected-chars" id="selectedChars"></div>
    <button class="btn btn-outline" onclick="clearSelection()" style="margin:8px">🔄 清空重选</button>
    <div id="answerZone" class="answer-zone hidden">
      <div class="answer-reveal">${q.answer}</div>
    </div>
  `;
}

function renderDuyin(q) {
  const opts = ['A','B','C','D'];
  let html = `<div class="q-prompt">🔊 读音选择</div>
    <div class="q-content">「${q.word}」中「<span style="color:#c0392b;text-decoration:underline">${q.char}</span>」的读音是？</div>
    <div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin:16px 0">`;
  q.options.forEach((opt, i) => {
    html += `<button class="btn btn-outline duyin-btn" data-idx="${i}" onclick="answerDuyin(${i})">${opts[i]}. ${opt}</button>`;
  });
  html += `</div><div id="answerZone" class="answer-zone hidden">
    <div class="answer-reveal">${q.options[q.answer]}</div>
    <div class="answer-extra">${q.note || ''}</div>
  </div>`;
  return html;
}

function renderBishun(q) {
  return `
    <div class="q-prompt">✍️ 笔顺书写</div>
    <div class="q-content" style="font-size:64px;color:#1a1a2e">${q.char}</div>
    <div class="q-sub">共 ${q.strokes} 画，请写出正确笔顺</div>
    <div id="answerZone" class="answer-zone hidden">
      <div class="answer-reveal" style="font-size:20px;letter-spacing:2px">${q.order}</div>
      <div class="answer-extra">${q.note}</div>
    </div>
  `;
}

function renderXiansuo(q) {
  const tags = q.clues.map(c => `<span class="clue-tag">${c}</span>`).join('');
  return `
    <div class="q-prompt">🔎 线索猜字</div>
    <div class="clue-row">${tags}</div>
    <div id="answerZone" class="answer-zone hidden">
      <div class="answer-reveal">${q.answer}</div>
      <div class="answer-extra">${q.explain}</div>
    </div>
  `;
}

// ========== 选字成语交互 ==========
function togglePoolChar(el, idx) {
  if (answered) return;
  const pos = selectedPoolIndices.indexOf(idx);
  if (pos >= 0) {
    selectedPoolIndices.splice(pos, 1);
    el.classList.remove('selected');
  } else {
    selectedPoolIndices.push(idx);
    el.classList.add('selected');
  }
  updateSelectedDisplay();
}

function clearSelection() {
  if (answered) return;
  selectedPoolIndices = [];
  document.querySelectorAll('.pool-char.selected').forEach(el => el.classList.remove('selected'));
  updateSelectedDisplay();
}

function updateSelectedDisplay() {
  const container = document.getElementById('selectedChars');
  if (!container) return;
  if (!xuanziCurrent) return;
  const pool = [...new Set(xuanziCurrent.pool.split(''))];
  container.innerHTML = selectedPoolIndices.map(i => `<span class="selected-char">${pool[i]}</span>`).join('');
}

function answerDuyin(idx) {
  if (answered) return;
  const q = getQuestion().q;
  const correct = (idx === q.answer);
  const btns = document.querySelectorAll('.duyin-btn');
  btns.forEach(b => {
    b.disabled = true;
    if (parseInt(b.dataset.idx) === q.answer) b.style.background = '#27ae60';
    if (parseInt(b.dataset.idx) === idx && !correct) b.style.background = '#e74c3c';
  });
  if (correct) markRight(); else markWrong();
  reveal();
}

// ========== 核心操作 ==========
function reveal() {
  if (answered) return;
  answered = true;
  document.getElementById('btnReveal').classList.add('hidden');
  document.getElementById('btnRight').classList.remove('hidden');
  document.getElementById('btnWrong').classList.remove('hidden');
  document.getElementById('answerZone').classList.remove('hidden');

  // 读音题自动判定
  const { bankKey } = getQuestion();
  if (bankKey === 'duyinXuanze') {
    // already handled in answerDuyin
    document.getElementById('btnRight').classList.add('hidden');
    document.getElementById('btnWrong').classList.add('hidden');
  }
}

function markRight() {
  if (!answered) return;
  totalDone++; totalRight++;
  addOrRemoveMistake(false);
  recordAndNext();
}

function markWrong() {
  if (!answered) return;
  totalDone++; totalWrong++;
  addOrRemoveMistake(true);
  recordAndNext();
}

function addOrRemoveMistake(add) {
  const { bankKey, idx } = getQuestion();
  const key = bankKey + '|' + idx;
  if (!mistakes[bankKey]) mistakes[bankKey] = [];
  if (add) {
    if (!mistakes[bankKey].includes(idx)) mistakes[bankKey].push(idx);
  } else {
    mistakes[bankKey] = mistakes[bankKey].filter(i => i !== idx);
  }
  updateMistakeUI();
}

function recordAndNext() {
  answered = false;
  selectedPoolIndices = [];
  updateStats();
  if (mistakeReviewMode) {
    reviewIdx++;
    if (reviewIdx >= reviewQueue.length) {
      // finished review round
      mistakeReviewMode = false;
      document.getElementById('mistakeList').innerHTML = '<span style="color:#aaa;font-size:14px">暂无错题，加油！</span>';
      document.getElementById('mistakeBtnRow').style.display = 'none';
      switchBank(currentBank);
      return;
    }
    showQuestion();
  } else {
    currentIndex++;
    const bank = questionBanks[currentBank];
    if (currentIndex >= bank.questions.length) {
      currentIndex = 0; // loop
    }
    showQuestion();
  }
}

function nextQuestion() {
  if (!answered) {
    // skip without recording
    selectedPoolIndices = [];
    if (mistakeReviewMode) {
      reviewIdx++;
      if (reviewIdx >= reviewQueue.length) {
        mistakeReviewMode = false;
        switchBank(currentBank);
        return;
      }
      showQuestion();
    } else {
      currentIndex++;
      const bank = questionBanks[currentBank];
      if (currentIndex >= bank.questions.length) currentIndex = 0;
      showQuestion();
    }
    return;
  }
  // already answered but didn't mark - treat as skip
  answered = false;
  selectedPoolIndices = [];
  if (mistakeReviewMode) {
    reviewIdx++;
    if (reviewIdx >= reviewQueue.length) {
      mistakeReviewMode = false;
      switchBank(currentBank);
      return;
    }
    showQuestion();
  } else {
    currentIndex++;
    const bank = questionBanks[currentBank];
    if (currentIndex >= bank.questions.length) currentIndex = 0;
    showQuestion();
  }
}

function updateStats() {
  document.getElementById('doneQ').textContent = totalDone;
  document.getElementById('rightQ').textContent = totalRight;
  document.getElementById('wrongQ').textContent = totalWrong;
  document.getElementById('mistakeCount').textContent = Object.values(mistakes).reduce((s, a) => s + a.length, 0);
  updateMistakeUI();
}

function updateMistakeUI() {
  const list = document.getElementById('mistakeList');
  const allMistakes = [];
  for (const [bankKey, indices] of Object.entries(mistakes)) {
    for (const idx of indices) {
      allMistakes.push({ bankKey, idx, label: questionBanks[bankKey].label });
    }
  }
  if (allMistakes.length === 0) {
    list.innerHTML = '<span style="color:#aaa;font-size:14px">暂无错题，加油！</span>';
    document.getElementById('mistakeBtnRow').style.display = 'none';
  } else {
    document.getElementById('mistakeBtnRow').style.display = 'flex';
    list.innerHTML = allMistakes.map((m, i) => {
      const q = questionBanks[m.bankKey].questions[m.idx];
      let preview = '';
      if (q.answer) preview = q.answer.substring(0, 8);
      else if (q.scrambled) preview = q.scrambled.substring(0, 8);
      return `<span class="mistake-item" onclick="reviewSingleMistake(${i})" title="${m.label}">${preview}</span>`;
    }).join('');
  }
  window._allMistakes = allMistakes;
}

function reviewSingleMistake(i) {
  const m = window._allMistakes[i];
  mistakeReviewMode = true;
  reviewQueue = [m];
  reviewIdx = 0;
  showQuestion();
}

function reviewMistakes() {
  if (!window._allMistakes || window._allMistakes.length === 0) return;
  mistakeReviewMode = true;
  reviewQueue = [...window._allMistakes];
  // shuffle
  for (let i = reviewQueue.length - 1; i > 0; i--) { const j = Math.floor(Math.random()*(i+1)); [reviewQueue[i],reviewQueue[j]]=[reviewQueue[j],reviewQueue[i]]; }
  reviewIdx = 0;
  showQuestion();
}

function clearMistakes() {
  mistakes = {};
  updateStats();
}

// ========== 键盘快捷键 ==========
document.addEventListener('keydown', function(e) {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  switch(e.code) {
    case 'Space':
      e.preventDefault();
      if (!answered) reveal();
      break;
    case 'ArrowRight':
      e.preventDefault();
      nextQuestion();
      break;
    case 'KeyA':
      e.preventDefault();
      if (answered) markRight();
      break;
    case 'KeyD':
      e.preventDefault();
      if (answered) markWrong();
      break;
  }
});

// ========== 初始化 ==========
init();

// 键盘提示
(function() {
  const hint = document.createElement('div');
  hint.className = 'keyboard-hint';
  hint.textContent = '⌨ 空格=显示答案 | →=下一题 | A=答对 | D=答错';
  document.querySelector('.main').appendChild(hint);
})();
</script>
