 render(q){return `<div class="prompt pinyin">${q.py}</div><div class="prompt defn">${q.df}</div>`},

// ============================
// 应用逻辑
// ============================
let cm=mods[0], ci=0, order=[], revealed=false, rl=[];
function stats(){try{return JSON.parse(localStorage.getItem('hztx_stats')||'{}')}catch(e){return{}}}
function saveStats(s){localStorage.setItem('hztx_stats',JSON.stringify(s))}
function updateUI(){
 let s=stats(), k=new Date().toDateString(), d=s[k]||{total:0,correct:0};
 document.getElementById('tT').textContent=d.total;
 document.getElementById('tC').textContent=d.correct;
 document.getElementById('rC').textContent=rl.length;
}
function record(correct){
 let s=stats(), k=new Date().toDateString();
 if(!s[k])s[k]={total:0,correct:0};
 s[k].total++; if(correct)s[k].correct++;
 saveStats(s); updateUI();
}
function buildTabs(){
 document.getElementById('tabBar').innerHTML=mods.map((m,i)=>`<button class="tab" data-idx="${i}" onclick="switchMod(${i})">${m.icon} ${m.name}</button>`).join('');
}
function switchMod(idx){
 cm=mods[idx]; ci=0; revealed=false; sfl();
 if(cm.id==='review'){cm.data=rl;if(!cm.data.length){document.getElementById('card').innerHTML='<div style="color:#999;font-size:18px;padding:40px;">✅ 暂无错题，继续刷题吧！</div>';return}sfl();}
 document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',i===idx));
 renderQ();
}
function sfl(){
 let len=cm.data.length;
 order=Array.from({length:len},(_,i)=>i);
 for(let i=len-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}
}
function item(){if(!order.length||ci>=order.length)return null;return cm.data[order[ci]]}
function renderQ(){
 let it=item(), card=document.getElementById('card');
 if(!it){card.innerHTML=`<div style="color:#999;font-size:18px;padding:40px;">🎉 本轮刷完！<br><br><button class="btn btn-primary" onclick="sfl();ci=0;renderQ();">🔄 重新打乱再来一轮</button></div>`;return}
 revealed=false;
 let tot=cm.data.length, prog=((ci)/tot*100).toFixed(1);
 card.innerHTML=`
  <div class="section-title">${cm.icon} ${cm.name} · ${cm.desc}</div>
  <div class="q-num">第 ${ci+1} / ${tot} 题</div>
  <div class="pwrap"><div class="plabel"><span>进度</span><span>${ci+1}/${tot}</span></div><div class="pbar"><div class="pfill" style="width:${prog}%"></div></div></div>
  ${cm.render(it)}
  <div id="aa" class="answer-area"></div>
  <div class="btn-row">
   <button class="btn btn-primary" onclick="reveal()" id="btnR">👁️ 显示答案（空格键）</button>
   <button class="btn btn-outline btn-sm" onclick="skip()" id="btnS">⏭ 跳过（→）</button>
  </div>
  <div id="asA" class="self-assess hidden"></div>`;
 document.getElementById('btnR').focus();
}
function reveal(){
 if(revealed)return; revealed=true;
 let it=item(); if(!it)return;
 document.getElementById('aa').innerHTML=cm.answer(it);
 document.getElementById('aa').classList.add('show');
 document.getElementById('asA').innerHTML=`<button class="btn btn-success" onclick="mc()">✅ 写对了</button><button class="btn btn-danger" onclick="mw()">❌ 没写对</button><button class="btn btn-outline btn-sm" onclick="mr()">📌 加入复习</button>`;
 document.getElementById('asA').classList.remove('hidden');
 document.getElementById('btnR').disabled=true;
 document.getElementById('btnS').disabled=true;
}
function mc(){record(true);nxt()}
function mw(){record(false);addR();nxt()}
function mr(){addR();nxt()}
function addR(){
 let it=item(); if(!it)return;
 let h=cm.render(it)+'<div style="margin-top:12px;">'+cm.answer(it)+'</div>';
 let ri={...it,_html:h,_module:cm.id};
 let dup=rl.find(r=>(r.word&&ri.word&&r.word===ri.word)||(r.idiom&&ri.idiom&&r.idiom===ri.idiom)||(r.ans&&ri.ans&&r.ans===ri.ans));
 if(!dup)rl.push(ri);
 updateUI();
}
function skip(){nxt()}
function nxt(){ci++;renderQ()}
document.addEventListener('keydown',e=>{
 if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;
 switch(e.code){
  case'Space':e.preventDefault();if(!revealed)reveal();break;
  case'ArrowRight':e.preventDefault();if(revealed)nxt();else skip();break;
  case'KeyA':if(revealed){e.preventDefault();mc()}break;
  case'KeyD':if(revealed){e.preventDefault();mw()}break;
  case'KeyR':if(revealed){e.preventDefault();mr()}break;
 }
});
function resetAll(){
 if(confirm('确定要重置今日数据吗？')){localStorage.removeItem('hztx_stats');rl=[];updateUI();sfl();ci=0;renderQ()}
}
// init
buildTabs(); sfl(); updateUI(); renderQ();
document.querySelectorAll('.tab')[0]?.classList.add('active');
</script>
