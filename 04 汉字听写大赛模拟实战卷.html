<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>汉字听写大赛 · 模拟实战卷</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:#f5f0eb;color:#2c1810;min-height:100vh}
.header{background:linear-gradient(135deg,#8b1a1a,#c41e3a);color:#fff;text-align:center;padding:24px 20px 16px}
.header h1{font-size:26px;margin-bottom:4px}
.header p{opacity:.8;font-size:14px}
.ctn{max-width:920px;margin:0 auto;padding:16px 20px 40px}

/* Exam selector */
.exam-tabs{display:flex;gap:8px;justify-content:center;margin:16px 0;flex-wrap:wrap}
.exam-tab{padding:12px 24px;border-radius:10px;background:#fff;border:2px solid #d4c5b2;cursor:pointer;font-weight:600;font-size:14px;transition:.2s}
.exam-tab:hover{border-color:#c41e3a}
.exam-tab.active{background:#c41e3a;color:#fff;border-color:#c41e3a}

/* Round card */
.round-card{background:#fff;border-radius:16px;padding:24px;margin:16px 0;box-shadow:0 2px 8px rgba(0,0,0,.06);border-left:5px solid #c41e3a}
.round-card.done{border-left-color:#22c55e;opacity:.85}
.round-card.current{border-left-color:#ffd700;box-shadow:0 4px 16px rgba(0,0,0,.12)}
.round-header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.round-num{width:40px;height:40px;border-radius:50%;background:#c41e3a;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px}
.round-num.done{background:#22c55e}
.round-num.current{background:#ffd700;color:#2c1810}
.round-title{font-size:18px;font-weight:700}
.round-score{font-size:13px;color:#888;margin-left:auto}
.round-q{padding:16px;background:#faf7f2;border-radius:8px;margin:8px 0}
.round-q .q-label{font-size:12px;color:#c41e3a;font-weight:600;margin-bottom:4px}
.round-q .q-text{font-size:16px;font-weight:600;line-height:1.6}
.round-q .q-answer{margin-top:8px;padding:8px 12px;background:#fff;border-radius:6px;font-weight:700;color:#c41e3a;display:none}

/* Score summary */
.score-panel{background:linear-gradient(135deg,#2c1810,#4a2c1a);color:#fff;border-radius:16px;padding:24px;text-align:center;margin:16px 0}
.score-panel .total-score{font-size:48px;font-weight:800;color:#ffd700}
.score-panel .detail{display:flex;gap:20px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.score-panel .detail-item{text-align:center}
.score-panel .detail-val{font-size:22px;font-weight:700;color:#ffd700}

/* Buttons */
.btn-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:12px 0}
.btn{padding:12px 24px;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;transition:.2s}
.btn-red{background:#c41e3a;color:#fff}
.btn-red:hover{background:#a01830}
.btn-green{background:#16a34a;color:#fff}
.btn-green:hover{background:#15803d}
.btn-outline{background:transparent;border:2px solid #c41e3a;color:#c41e3a}
.btn-outline:hover{background:#fef2f2}
.btn-gold{background:linear-gradient(135deg,#ffd700,#f0a500);color:#2c1810}
.btn-gold:hover{background:linear-gradient(135deg,#ffe44d,#f5b800)}

/* Progress steps */
.steps{display:flex;justify-content:center;gap:0;margin:16px 0}
.step{text-align:center;flex:1;max-width:120px}
.step-dot{width:36px;height:36px;border-radius:50%;background:#d4c5b2;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;margin:0 auto 4px}
.step-dot.active{background:#c41e3a}
.step-dot.done{background:#22c55e}
.step-line{flex:1;height:2px;background:#d4c5b2;margin-top:17px;max-width:40px}
.step-line.done{background:#22c55e}
.step-label{font-size:11px;color:#888}

@media(max-width:600px){
.header h1{font-size:20px}
.round-card{padding:16px}
.round-q .q-text{font-size:14px}
.score-panel .total-score{font-size:36px}
}
</style>
</head>

          {type:"诗词纠错",q:"「粉身碎骨浑不怕，要留清白在人间」中哪个字可能有问题？",answer:"「浑」无误，意为全、都",note:"于谦《石灰吟》，书写正确"},
          {type:"诗词纠错",q:"「出师未捷生先死，长使英雄泪满襟」是否有错？",answer:"有误！「生」应为「身」——出师未捷身先死",note:"正确：出师未捷身先死，长使英雄泪满襟。"},
          {type:"点字成诗",q:"从「海内存知己天涯若比邻」中选字组成下句",answer:"天涯若比邻",note:"王勃《送杜少府之任蜀州》"},
          {type:"点字成诗",q:"从「等闲识得东风面万紫千红总是春」中选字组成下句",answer:"万紫千红总是春",note:"朱熹《春日》"},
          {type:"点字成诗",q:"从「纸上得来终觉浅绝知此事要躬行」中选字组成下句",answer:"绝知此事要躬行",note:"陆游《冬夜读书示子聿》"},
        ]
      },
      {
        name:"各显神通",score:60,questions:[
          {type:"填字题",q:"请填写：万马齐（ ）",answer:"喑",note:"万马齐喑(yīn)：比喻人们都沉默不说话。"},
          {type:"填字题",q:"请填写：开门（ ）盗",answer:"揖",note:"开门揖(yī)盗：开门请强盗进来，比喻引进坏人自招祸患。"},
          {type:"填字题",q:"请写出：暴tiǎn（ ）天物",answer:"殄",note:"暴殄(tiǎn)天物：任意糟蹋东西。"},
        ]
      },
      {
        name:"乘胜追击",score:110,questions:[
          {type:"成语听写",q:"听写成语：fén gāo jì guǐ",answer:"焚膏继晷",note:"点灯接续日光，形容夜以继日地学习工作。"},
          {type:"成语听写",q:"听写成语：mài guān yù jué",answer:"卖官鬻爵",note:"出卖官职爵位，形容政治腐败。"},
          {type:"成语听写",q:"听写成语：jìn ruò hán chán",answer:"噤若寒蝉",note:"像深秋的蝉一样不出声，形容不敢作声。"},
          {type:"成语还原",q:"将「三舍退避」还原为正确成语",answer:"退避三舍",note:"后退九十里。比喻对人让步避免冲突。"},
          {type:"成语还原",q:"将「盗铃掩耳」还原为正确成语",answer:"掩耳盗铃",note:"捂住耳朵偷铃铛，比喻自己欺骗自己。"},
          {type:"选字成语",q:"比喻根基深厚牢固（从「根深蒂固底谛抵」中选）",answer:"根深蒂固"},
          {type:"选字成语",q:"形容极其热情（从「满腔热忱枕忱沈」中选）",answer:"满腔热忱"},
        ]
      },
      {
        name:"巅峰对决",score:200,questions:[
          {type:"抢答-选择",q:"「不刊之论」中「刊」意思是？",opts:["A. 削除修改","B. 刊登出版","C. 砍伐","D. 雕刻"],answer:"A",note:"不刊之论：不可修改的言论。刊：削除，古代在竹简上写字有误就削去。"},
          {type:"抢答-选择",q:"「蚍蜉撼树」中「蚍蜉」指？",opts:["A. 大蚂蚁","B. 蚊子","C. 小虫子","D. 蝉"],answer:"A",note:"蚍蜉撼树：蚂蚁想摇动大树，比喻不自量力。"},
          {type:"抢答-读音",q:"「拾级而上」中「拾」读？",opts:["A. shè","B. shí","C. shì","D. shě"],answer:"A",note:"拾(shè)级：逐级登阶。"},
          {type:"抢答-读音",q:"「一曝十寒」中「曝」读？",opts:["A. pù","B. bào","C. pū","D. bù"],answer:"A",note:"曝(pù)：晒。"},
          {type:"抢答-图文",q:"【图】螳螂举起前臂试图挡住飞奔的马车。什么成语？",opts:["A. 螳臂当车","B. 蚍蜉撼树","C. 以卵击石","D. 不自量力"],answer:"A"},
          {type:"抢答-图文",q:"【图】一群人各摸大象的不同部位争论不休。什么成语？",opts:["A. 盲人摸象","B. 以偏概全","C. 各执一词","D. 众说纷纭"],answer:"A"},
          {type:"抢答-填字",q:"请填写：不落（ ）臼",answer:"窠",note:"不落窠臼(kē jiù)。"},
          {type:"抢答-填字",q:"请填写：虚与委（ ）",answer:"蛇",note:"虚与委蛇(wēi yí)：敷衍应付。"},
          {type:"抢答-线索",q:"【线索】上下结构、22画、读náng、口袋",opts:["A. 囊","B. 齉","C. 囔","D. 馕"],answer:"A",note:"囊(náng)。"},
          {type:"抢答-笔顺",q:"「方」字第三笔是什么？",opts:["A. 横折钩","B. 撇","C. 横","D. 点"],answer:"A",note:"方笔顺：点、横、横折钩、撇。"},
        ]
      },
      {
        name:"一锤定音(加赛)",score:0,questions:[
          {type:"加赛题",q:"请写出：bì lù lán lǚ",answer:"筚路蓝缕",note:"驾柴车穿破衣开辟山林，形容创业艰辛。"},
        ]
      }
    ]
  }
];

let currentExamIdx = 0;
let currentRoundIdx = 0;
let revealedQ = {}; // "exam|round|qidx" -> true
let scoreData = [ // per exam
  {rounds:[0,0,0,0,0]},
  {rounds:[0,0,0,0,0]},
  {rounds:[0,0,0,0,0]}
];

function switchExam(idx){
  currentExamIdx = idx;
  currentRoundIdx = 0;
  document.querySelectorAll('.exam-tab').forEach((t,i)=>t.classList.toggle('active',i===idx));
  renderExam();
}

function renderExam(){
  const exam = exams[currentExamIdx];
  let html = '';

  // Progress steps
  html += '<div class="steps">';
  exam.rounds.forEach((r, i) => {
    if(i>0) html += '<div class="step-line'+(i<=currentRoundIdx?' done':'')+'"></div>';
    const cls = i<currentRoundIdx?'done':(i===currentRoundIdx?'active':'');
    html += `<div class="step"><div class="step-dot ${cls}">${i+1}</div><div class="step-label">${r.name}</div></div>`;
  });
  html += '</div>';

  // Rounds
  exam.rounds.forEach((r, ri) => {
    if(ri > currentRoundIdx) return; // only show up to current
    const done = ri < currentRoundIdx;
    const current = ri === currentRoundIdx;
    html += `<div class="round-card${done?' done':''}${current?' current':''}">`;
    html += `<div class="round-header">`;
    html += `<div class="round-num${done?' done':''}${current?' current':''}">${done?'✓':ri+1}</div>`;
    html += `<div class="round-title">环节${ri+1}：${r.name}</div>`;
    html += `<div class="round-score">${r.score>0?r.score+'分':'(加赛)'}</div>`;
    html += '</div>';

    r.questions.forEach((q, qi) => {
      const key = `${currentExamIdx}|${ri}|${qi}`;
      const revealed = !!revealedQ[key];
      html += `<div class="round-q">`;
      html += `<div class="q-label">${q.type}</div>`;
      html += `<div class="q-text">${q.q}</div>`;
      if(!revealed && current){
        html += `<button class="btn btn-red" style="margin-top:8px;font-size:12px;padding:6px 16px" onclick="revealQ(${ri},${qi})">👁 查看答案</button>`;
      }
      html += `<div class="q-answer" style="display:${revealed?'block':'none'}">`;
      html += `✅ <b>${q.answer}</b>`;
      if(q.note) html += `<br><span style="font-size:13px;color:#666">${q.note}</span>`;
      if(q.opts && revealed){
        html += `<br><span style="font-size:13px;color:#888">选项：${q.opts.join(' | ')}</span>`;
      }
      html += '</div>';
      html += '</div>';
    });

    if(current){
      html += `<div class="btn-row">`;
      html += `<button class="btn btn-green" onclick="finishRound()">✅ 完成本环节，进入下一环节</button>`;
      html += '</div>';
    }
    html += '</div>';
  });

  // Score summary
  if(currentRoundIdx >= exam.rounds.length){
    const sd = scoreData[currentExamIdx];
    const total = sd.rounds.reduce((s,v)=>s+v,0);
    html += `<div class="score-panel">`;
    html += `<div style="font-size:14px;opacity:.7">📊 成绩汇总</div>`;
    html += `<div class="total-score">${total} / 490</div>`;
    html += `<div class="detail">`;
    exam.rounds.forEach((r,i)=>{
      const max = i===0?120:i===1?60:i===2?110:i===3?200:r.score;
      html += `<div class="detail-item"><div>${r.name}</div><div class="detail-val">${sd.rounds[i]}/${max}</div></div>`;
    });
    html += '</div>';
    html += `<div class="btn-row" style="margin-top:16px">`;
    html += `<button class="btn btn-gold" onclick="resetExam()">🔄 重新模拟</button>`;
    html += `<button class="btn btn-outline" onclick="switchExam((currentExamIdx+1)%3)" style="color:#fff;border-color:#fff">📝 做下一套</button>`;
    html += '</div>';
    html += '</div>';
  }

  document.getElementById('examContent').innerHTML = html;
}

function revealQ(ri, qi){
  const key = `${currentExamIdx}|${ri}|${qi}`;
  revealedQ[key] = true;
  renderExam();
}

function finishRound(){
  const exam = exams[currentExamIdx];
  const round = exam.rounds[currentRoundIdx];

  // Auto-score: count revealed answers as "attempted"
  // For simulation, let user input their own score
  const totalInRound = round.questions.length;
  const prompts = {
    0: "环节一「初露锋芒」共12题（120分），每题约10分。\n请根据您的作答情况自行评分：",
    1: "环节二「各显神通」共3题（60分），每题20分（填对一字5分）。\n请自行评分：",
    2: "环节三「乘胜追击」共7题（110分）。\n请自行评分：",
    3: "环节四「巅峰对决」共10题（200分），每题20分。\n请自行评分：",
    4: "加赛环节。\n请自行评分："
  };

  const maxScore = currentRoundIdx===0?120:currentRoundIdx===1?60:currentRoundIdx===2?110:currentRoundIdx===3?200:10;
  const promptMsg = prompts[currentRoundIdx] || '';
  const input = prompt(promptMsg + `\n请输入得分（满分${maxScore}分）：`, '0');

  if(input === null) return; // cancelled
  const score = Math.max(0, Math.min(maxScore, parseInt(input)||0));
  scoreData[currentExamIdx].rounds[currentRoundIdx] = score;

  currentRoundIdx++;
  if(currentRoundIdx >= exam.rounds.length){
    // All rounds done
    renderExam();
  } else {
    renderExam();
    // Scroll to current round
    setTimeout(()=>{
      const current = document.querySelector('.round-card.current');
      if(current) current.scrollIntoView({behavior:'smooth'});
    },100);
  }
}

function resetExam(){
  currentRoundIdx = 0;
  revealedQ = {};
  scoreData[currentExamIdx] = {rounds:[0,0,0,0,0]};
  renderExam();
}

// Init
switchExam(0);
</script>
